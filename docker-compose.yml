services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flightbooking-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - flightbooking-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flightbooking-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FlightBookingDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      Jwt__SecretKey: "${JWT_SECRET}"
    ports:
      - "8080:8080"
    networks:
      - flightbooking-net

volumes:
  sqlserver_data:

networks:
  flightbooking-net:
    driver: bridge